name: replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-and-rational:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - working-directory: replay
        run: |
          set -e
          python check.py
          python certify_integral.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: replay
          use-github-cache: false
          build: true
